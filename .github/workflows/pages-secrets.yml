name: pages-secrets
# Manual: gives the Cloudflare Pages project the secrets its functions need, from the GitHub
# secrets of the same name. Today: BUTTONDOWN_API_KEY for the newsletter sign-up
# (functions/api/subscribe.js). Run after the Pages project changes (e.g. a rename), then
# redeploy: a Pages secret takes effect with the next deployment.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write   # to start a deploy afterwards
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'indiamacrofinance' }}
    steps:
      - name: Set BUTTONDOWN_API_KEY on the Pages project
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: printf '%s' "$BUTTONDOWN_API_KEY" | npx --yes wrangler@4 pages secret put BUTTONDOWN_API_KEY --project-name="$PAGES_PROJECT"
      - name: Redeploy so the secret takes effect
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -R "${{ github.repository }}"
