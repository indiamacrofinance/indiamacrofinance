name: markets-bot
# Markets, the rupee and its drivers, policy rates: hourly Mon-Fri 09:30-17:30 IST, and 07:00 IST
# Mon-Sat (overnight US moves, before the 07:30 morning email). Sources: registry/bots.yaml.
# Times are IST; cron is UTC.
on:
  schedule:
    - cron: "0 4-12 * * 1-5"
    - cron: "30 1 * * 1-6"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: data-bots
  cancel-in-progress: false
jobs:
  run:
    uses: ./.github/workflows/bot.yml
    with:
      bot: markets
