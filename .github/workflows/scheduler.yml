name: scheduler
# Deploys the Cloudflare Worker in scheduler/ that starts the other workflows on time (GitHub's
# own cron runs hours late). Runs when scheduler/ changes, or by hand. The Worker's GITHUB_TOKEN
# secret is set by the maintainer in the Cloudflare dashboard, not here.
on:
  push:
    branches: [main]
    paths: ["scheduler/**", ".github/workflows/scheduler.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test the schedule
        run: node scheduler/test.mjs
      - name: Deploy the Worker
        working-directory: scheduler
        run: npx --yes wrangler@4 deploy
