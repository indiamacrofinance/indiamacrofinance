# Cloudflare Worker that starts the GitHub workflows on time (see worker.js).
# Deployed by .github/workflows/scheduler.yml. Secret GITHUB_TOKEN is set in the Cloudflare dashboard.
name = "indiamacrofinance-scheduler"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
REPO = "indiamacrofinance/indiamacrofinance"
SITE = "https://indiamacrofinance.pages.dev"

[triggers]
crons = ["*/5 * * * *"]
