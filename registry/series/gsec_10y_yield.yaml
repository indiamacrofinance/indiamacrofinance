id: gsec_10y_yield
title: 10-year Government of India benchmark bond yield
short_title: 10-yr G-sec
area: markets
source:
  agency: RBI
  dataset: Market Trends panel, RBI home page
  url: https://www.rbi.org.in/
  module: pipelines/sources/rbi/home_rates.py
licence: unverified
downloadable: false
fetch: auto
frequency: D
unit: percent
base_year: null
seasonal_adjustment: none
transforms:
- level
- diff
release:
  calendar: rbi
  rule: previous business day's yield, read daily
  lag_days: 5
validation:
  range:
  - 2
  - 15
  revision_alert: 0   # a closing yield for a date should never change: any change is a misread page, so flag it
pages:
- page: home
  section: key-indicators
- page: markets
  section: cross-asset
original: false
discontinued: null
owner: ''
verified_against: []
notes: The listed security whose maturity is closest to 10 years; the security name
  is in the note column (it changes when the benchmark rolls).
exclude:
- period: '2026-11-02'
  added: '2026-11-05'
  reason: Stored as 7.3250% (RBI home page "as on November 02, 2026", read 3 Nov 12:30 IST and
    still so on 4 Nov 09:30 IST), then overwritten with 7.3102% at 10:30 IST on 4 Nov, when RBI
    had updated some yields to 3 November's closes but not yet the date (by 11:30 IST the page
    said November 03 with 7.3102%). The stored value is 3 November's; 7.3250% is in the revision
    log. Pages archived in the markets-bot run artifacts of those hours (kept 30 days).
- period: '2026-11-30'
  vintage: '2026-11-03'
  added: '2026-11-05'
  reason: RBI's home page, read at 09:30 IST on 3 Nov 2026, dated its G-sec yields "as on
    November 30, 2026", a date still in the future. The yield it gave (7.4243% on 6.94% GS
    2036) is exactly the 30 October close, so the page meant October 30, which we already
    have. Only the row stored on 3 Nov is left out; the real 30 November yield will replace it.
