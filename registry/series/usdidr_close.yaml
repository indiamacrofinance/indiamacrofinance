id: usdidr_close
title: Indonesian rupiah per US dollar (daily close)
short_title: USD/IDR
area: markets
source:
  agency: Yahoo Finance (market data)
  dataset: IDR=X
  url: https://finance.yahoo.com/
  module: pipelines/sources/yahoo/markets.py
licence: show-only
downloadable: false
fetch: auto
frequency: D
unit: idr_per_usd
base_year: null
seasonal_adjustment: none
transforms:
- level
release:
  calendar: none
  rule: live through the day; the day closes at 05:30 IST
  lag_days: 5
validation:
  range:
  - 8000
  - 30000
  revision_alert: 1
pages:
- page: rupee
  section: drivers
original: false
discontinued: null
owner: ''
verified_against: []
notes: Yahoo's FX day runs 05:30-05:30 IST; today's value is a live quote, rewritten
  on each run until the day closes. Each completed day is Yahoo's daily close or the day's last
  hourly price, whichever is nearer the ECB reference rate, because Yahoo's FX data carries
  occasional bad ticks.
exclude:
- period: '2026-11-07'
  added: '2026-11-16'
  reason: Stored from a Saturday run as a live quote; FX markets are shut on Saturdays and
    Yahoo's history (checked 16 Nov 2026) has no bar on this day. Weekend bars are now dropped
    in pipelines/sources/yahoo/markets.py.
- period: '2026-11-08'
  added: '2026-11-16'
  reason: Yahoo dated the Monday session on the Sunday when the 07:00 IST markets-bot run read
    it (Monday 9 Nov); Yahoo later re-dated its bar to 2026-11-09, so this row was never
    revised away. Yahoo's history (checked 16 Nov 2026) has no bar on this day. Weekend bars are
    now dropped in pipelines/sources/yahoo/markets.py.
- period: '2026-11-14'
  added: '2026-11-16'
  reason: Stored from a Saturday run as a live quote; FX markets are shut on Saturdays and
    Yahoo's history (checked 16 Nov 2026) has no bar on this day. Weekend bars are now dropped
    in pipelines/sources/yahoo/markets.py.
