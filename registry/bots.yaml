# Data bots: which GitHub workflow fetches which sources, and when (times IST).
# Each bot is a workflow (.github/workflows/bot-<name>.yml) that runs
#   python -m pipelines.run --bot <name>
# and commits under its own name only when its data changed (scripts/bot_commit.py), then
# triggers a deploy. Every `fetch: auto` source must be in exactly one bot
# (tests/test_registry.py). Derived sources go in the bot that fetches their inputs.
# Manual sources (fetch: manual, e.g. Grid-India) are not here: `make india-update`.
# Bots share one queue (concurrency group "data-bots"), so their schedules are staggered.
# WHO STARTS THEM (since 2026-11-02): the Cloudflare Worker in scheduler/ (worker.js, SCHEDULE),
# on time to the minute. The `schedule:` crons in the workflows are only a backup (GitHub runs
# them hours late). Change a time in BOTH places. Live schedule and next runs:
# https://indiamacrofinance-scheduler.bishmaykbarik.workers.dev/schedule
# The same Worker's front page is the live status dashboard, which reads this file through
# site/public/status-map.json (pipelines/build/status_map.py); see the operations runbook.
bots:
  markets:
    when: "Mon-Fri hourly 09:30-17:30, and Mon-Sat 07:00 (before the morning email)"
    sources: [rbi_home_rates, yahoo_markets, derived_brent_inr, fbil_gsec_curve, derived_term_spread, nsdl_fpi, nsdl_fpi_daily]
  mospi:
    when: "Mon-Sat 17:00 (MoSPI releases at 16:00), catch-up 20:00"
    sources: [mospi_cpi, mospi_cpi_food, mospi_iip, mospi_nas, mospi_nas_oldbase, mospi_nas_annual, mospi_nas_annual_sectors, mospi_plfs, mospi_states, labourbureau_cpi_iw, mospi_cpi_items, derived_core_cpi, derived_cpi_underlying]
  rbi:
    when: "Mon-Sat 18:30"
    sources: [rbi_wss, rbi_payments, rbi_sectoral_credit, rbi_lending_rates, rbi_bop, rbi_bop_quarterly, rbi_fx_operations, rbi_external_debt, rbi_ecb, rbi_services_trade, rbi_surveys, rbi_iesh, rbi_mpc_decisions, rbi_mpc_projections_q, fbil_refrates, derived_credit_deposit, derived_credit_contributions, rbi_general_government, rbi_handbook_valuation, rbi_state_finances, derived_state_fiscal_ratios]
  ministries:
    when: "Mon-Sat 19:30, and daily 13:00"
    sources: [commerce_trade, gst_collections, cga_monthly_accounts, cga_tax_heads, oea_wpi, oea_core_industries, ppac_consumption, siam_sales, fada_retail, gst_ewaybills, aai_traffic, bis_eer, budget_glance, budget_demands, amfi_monthly, intl_peers]
